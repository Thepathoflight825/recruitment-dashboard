<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月度人力資源報告 · 班班日常</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a1a2e;
    --blue: #185FA5;   --blue-light: #E6F1FB;
    --teal: #1D9E75;   --teal-light: #E1F5EE;
    --amber: #EF9F27;  --amber-light: #FAEEDA;
    --red: #E24B4A;    --red-light: #FCEBEB;
    --purple: #6B4FA0; --purple-light: #EFE9FA;
    --gray: #F7F6F2;   --border: #E8E6DF;
    --text: #1a1a2e;   --text-sub: #888780;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: #F2F1EC; color: var(--text); min-height: 100vh; }

  /* ── Auth ── */
  #auth-overlay { position:fixed; inset:0; background:#0d1b2a; display:flex; align-items:center; justify-content:center; z-index:9999; }
  #auth-box { background:#fff; border-radius:16px; padding:40px 36px; width:340px; text-align:center; box-shadow:0 8px 40px rgba(0,0,0,.4); }
  #auth-box h2 { font-size:20px; font-weight:700; color:#0d1b2a; margin:0 0 6px; }
  #auth-box p  { font-size:13px; color:#6b7c93; margin:0 0 24px; line-height:1.6; }
  #auth-input { width:100%; padding:11px 14px; border:1.5px solid #dde3ec; border-radius:8px; font-size:15px; font-family:inherit; outline:none; transition:border .2s; }
  #auth-input:focus { border-color:#185FA5; }
  #auth-btn { margin-top:12px; width:100%; padding:12px; background:#0d1b2a; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  #auth-btn:hover { background:#1a2e44; }
  #auth-error { margin-top:10px; font-size:12px; color:#E24B4A; min-height:16px; }
  #no-access { display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:12px; }
  #no-access h2 { font-size:18px; font-weight:700; color:#fff; }
  #no-access p  { font-size:13px; color:#8899aa; }
  #no-access button { margin-top:8px; padding:10px 24px; background:#185FA5; color:#fff; border:none; border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit; }

  /* ── Header ── */
  .header { background: var(--navy); padding: 0 32px; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; }
  .header-left { display:flex; flex-direction:column; }
  .header-title { font-size:16px; font-weight:700; color:#fff; }
  .header-sub   { font-size:11px; color:#6c9bc8; margin-top:2px; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .month-badge  { font-size:12px; color:#EF9F27; background:rgba(239,159,39,.15); border:0.5px solid rgba(239,159,39,.4); border-radius:20px; padding:4px 14px; font-weight:600; }
  .nav-back     { font-size:11px; color:#aac4e0; background:rgba(255,255,255,.06); border:0.5px solid rgba(255,255,255,.18); border-radius:8px; padding:5px 12px; cursor:pointer; font-family:inherit; transition:all .2s; }
  .nav-back:hover { background:rgba(255,255,255,.14); color:#fff; }
  #user-badge { font-size:11px; color:#6c9bc8; display:flex; align-items:center; gap:6px; }
  #user-badge span { font-weight:600; color:#EF9F27; }
  #logout-btn { background:none; border:none; cursor:pointer; font-size:11px; color:#aab4be; font-family:inherit; text-decoration:underline; }
  #logout-btn:hover { color:#E24B4A; }

  /* ── Main ── */
  .main { max-width: 1100px; margin: 0 auto; padding: 24px 24px 60px; }

  /* ── Generate bar ── */
  .gen-bar { background:#fff; border-radius:12px; border:0.5px solid var(--border); padding:16px 20px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .gen-bar-left { display:flex; flex-direction:column; gap:4px; }
  .gen-bar-title { font-size:13px; font-weight:700; color:var(--navy); }
  .gen-bar-desc  { font-size:11px; color:var(--text-sub); }
  .gen-btn { background:var(--navy); color:#fff; border:none; border-radius:8px; padding:10px 22px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:8px; transition:background .2s; flex-shrink:0; }
  .gen-btn:hover { background:#2a2a4a; }
  .gen-btn:disabled { background:#aaa; cursor:not-allowed; }
  .gen-btn .spinner-sm { width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; display:none; }
  .gen-btn.loading .spinner-sm { display:inline-block; }
  .gen-btn.loading .btn-text { display:none; }
  .period-select { padding:6px 12px; border:0.5px solid var(--border); border-radius:6px; font-size:12px; font-family:inherit; background:#fff; cursor:pointer; }

  /* ── Section headers ── */
  .section-title { font-size:11px; font-weight:700; color:var(--text-sub); letter-spacing:.07em; margin:24px 0 10px; padding-bottom:6px; border-bottom:0.5px solid var(--border); }

  /* ── KPI cards strip ── */
  .kpi-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:6px; }
  .kpi-card { background:#fff; border-radius:10px; border:0.5px solid var(--border); padding:14px 16px; position:relative; overflow:hidden; }
  .kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
  .kpi-card.hr::before     { background:#3B8BD4; }
  .kpi-card.recruit::before{ background:#1D9E75; }
  .kpi-card.care::before   { background:#6B4FA0; }
  .kpi-card.att::before    { background:#BA7517; }
  .kpi-card-label { font-size:10px; color:var(--text-sub); margin-bottom:4px; }
  .kpi-card-val   { font-size:26px; font-weight:700; line-height:1; }
  .kpi-card-sub   { font-size:10px; color:#b4b2a9; margin-top:4px; }
  .kpi-card-tag   { position:absolute; top:10px; right:12px; font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; }
  .tag-ok     { background:var(--teal-light);   color:var(--teal); }
  .tag-warn   { background:var(--amber-light);  color:#854F0B; }
  .tag-danger { background:var(--red-light);    color:#A32D2D; }
  .tag-info   { background:var(--blue-light);   color:var(--blue); }

  /* ── Block panels ── */
  .block-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:14px; }
  .block-panel { background:#fff; border-radius:12px; border:0.5px solid var(--border); padding:16px 18px; }
  .block-panel-title { font-size:12px; font-weight:700; color:var(--navy); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
  .metric-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:0.5px solid #F1EFE8; font-size:12px; }
  .metric-row:last-child { border-bottom:none; }
  .metric-label { color:var(--text-sub); }
  .metric-val   { font-weight:700; color:var(--navy); }
  .metric-val.red    { color:var(--red); }
  .metric-val.teal   { color:var(--teal); }
  .metric-val.amber  { color:var(--amber); }

  /* ── Risk list ── */
  .risk-list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .risk-item { border-radius:10px; padding:12px 16px; display:flex; align-items:flex-start; gap:12px; border-left:4px solid; }
  .risk-item.high   { background:#FFF2F2; border-color:#E24B4A; }
  .risk-item.medium { background:#FFFBF0; border-color:#EF9F27; }
  .risk-item.low    { background:#F0F6FF; border-color:#3B8BD4; }
  .risk-icon  { font-size:16px; flex-shrink:0; margin-top:1px; }
  .risk-body  { flex:1; }
  .risk-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
  .risk-level-badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap; }
  .risk-item.high   .risk-level-badge { background:#E24B4A; color:#fff; }
  .risk-item.medium .risk-level-badge { background:#EF9F27; color:#fff; }
  .risk-item.low    .risk-level-badge { background:#3B8BD4; color:#fff; }
  .risk-source-badge { font-size:10px; padding:2px 7px; border-radius:20px; background:#F1EFE8; color:#5F5E5A; }
  .risk-title  { font-size:13px; font-weight:700; color:var(--navy); }
  .risk-metric { font-size:11px; color:var(--text-sub); margin-bottom:4px; }
  .risk-desc   { font-size:12px; color:#444; line-height:1.6; }

  /* ── AI 敘述區 ── */
  .ai-panel { background:#fff; border-radius:12px; border:0.5px solid var(--border); padding:22px 24px; margin-bottom:14px; }
  .ai-panel-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .ai-panel-title  { font-size:14px; font-weight:700; color:var(--navy); }
  .ai-badge { font-size:10px; background:var(--purple-light); color:var(--purple); padding:2px 8px; border-radius:20px; font-weight:600; }
  .ai-loading { display:flex; align-items:center; gap:10px; color:var(--text-sub); font-size:13px; padding:20px 0; }
  .spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; }
  .ai-content { font-size:13px; color:#333; line-height:1.9; white-space:pre-wrap; }
  .ai-placeholder { color:var(--text-sub); font-size:13px; padding:20px 0; font-style:italic; }

  /* ── 可執行方案 ── */
  .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .action-card { background:#fff; border-radius:10px; border:0.5px solid var(--border); padding:16px 18px; }
  .action-header { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .action-icon  { font-size:20px; flex-shrink:0; }
  .action-meta  { flex:1; }
  .action-title { font-size:13px; font-weight:700; color:var(--navy); }
  .action-tag   { font-size:10px; color:var(--text-sub); margin-top:2px; }
  .action-body  { font-size:12px; color:#444; line-height:1.7; padding-left:30px; }
  .action-body li { margin-bottom:4px; }
  .action-steps { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; padding-left:30px; }
  .action-step  { background:var(--gray); border-radius:6px; padding:3px 9px; font-size:11px; color:#555; border:0.5px solid var(--border); }

  /* ── Empty / error states ── */
  .empty-state { text-align:center; padding:24px; color:var(--text-sub); font-size:13px; }
  .loading-state { display:flex; align-items:center; justify-content:center; height:120px; gap:8px; color:var(--text-sub); font-size:13px; }

  /* ── Print ── */
  .print-bar { display:flex; gap:8px; justify-content:flex-end; margin-bottom:16px; }
  .print-btn { background:#fff; border:0.5px solid var(--border); border-radius:8px; padding:8px 16px; font-size:12px; cursor:pointer; font-family:inherit; color:var(--navy); transition:background .2s; }
  .print-btn:hover { background:var(--gray); }

  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin   { to { transform:rotate(360deg); } }

  @media print {
    .header, .gen-bar, .print-bar, #auth-overlay { display:none !important; }
    .main { padding:0; }
    body { background:#fff; }
  }
</style>
</head>
<body>

<!-- ── Auth overlay ── -->
<div id="auth-overlay">
  <div id="auth-box">
    <h2>📊 月度人力資源報告</h2>
    <p>勝海科技・班班日常<br>此頁面為 HR 專用，請輸入您的密碼</p>
    <input id="auth-input" type="password" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button id="auth-btn" onclick="doLogin()">進入</button>
    <div id="auth-error"></div>
  </div>
  <!-- 無權限提示（覆蓋在同一 overlay 層） -->
  <div id="no-access">
    <h2>🔒 無存取權限</h2>
    <p>此頁面僅限 HR 管理員使用</p>
    <button onclick="location.href='index.html'">返回招募儀表板</button>
  </div>
</div>

<!-- ── Header ── -->
<div class="header">
  <div class="header-left">
    <div class="header-title">📊 月度人力資源報告</div>
    <div class="header-sub">勝海科技 · 班班日常</div>
  </div>
  <div class="header-right">
    <span class="month-badge" id="month-badge">— 年 — 月</span>
    <button class="nav-back" onclick="location.href='index.html'">← 招募儀表板</button>
    <div id="user-badge"><span id="user-name"></span> <button id="logout-btn" onclick="doLogout()">登出</button></div>
  </div>
</div>

<div class="main" id="main-content" style="display:none">

  <!-- 操作列 -->
  <div class="gen-bar">
    <div class="gen-bar-left">
      <div class="gen-bar-title">📋 複製數據給 AI</div>
      <div class="gen-bar-desc">點擊後複製當月數據摘要，貼入「班班日常月報產生器」Claude Project 即可生成月度敘述報告</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <select id="period-select" class="period-select" onchange="onPeriodChange(this.value)">
        <option value="current" selected>當月</option>
        <option value="prev">上個月</option>
        <option value="3m">近三個月</option>
      </select>
      <button class="gen-btn" id="copy-ai-btn" onclick="copyDataForAI()">
        <span class="btn-text">📋 複製數據給 AI</span>
      </button>
    </div>
  </div>

  <!-- 列印 -->
  <div class="print-bar">
    <button class="print-btn" onclick="window.print()">🖨 列印報告</button>
    <button class="print-btn" onclick="copyReportText()">📋 複製文字</button>
  </div>

  <!-- ── 四大區塊核心指標（人力資源／考勤／招募／關懷）── -->
  <div class="section-title">📌 本月核心指標總覽</div>
  <div class="kpi-strip" id="kpi-strip">
    <div class="loading-state"><div class="spinner"></div>載入中...</div>
  </div>

  <!-- ── 2×2 詳細指標 ── -->
  <div class="block-grid" id="block-grid">
    <div class="loading-state"><div class="spinner"></div>載入中...</div>
  </div>

  <!-- ── 風險預告 ── -->
  <div class="section-title">🚨 風險預告</div>
  <div class="risk-list" id="risk-list">
    <div class="loading-state"><div class="spinner"></div>載入中...</div>
  </div>

  <!-- ── 可執行方案 ── -->
  <div class="section-title">💡 可執行方案</div>
  <div class="action-grid" id="action-grid">
    <div class="loading-state"><div class="spinner"></div>載入中...</div>
  </div>

</div><!-- /main -->

<script>
// ══════════════════════════════════════
//  設定
// ══════════════════════════════════════
const WORKER_URL   = 'https://lark-recruitment-api.sherrya82255.workers.dev';
const BASE_TOKEN   = 'E3X4blbxWa4DaLsSxsClZ3KbgYb';

// 招募 Base 表格
const RECRUIT_TABLES = {
  招募名單:     'tbl9yLmC7gMtdN6A',
  電訪紀錄:     'tblkTPzuymEcZoyx',
  面談紀錄:     'tblaQzLBQlItTtiB',
  履歷收件統計: 'tblHKMr3Xlf3g6KS',
};
// 人力資源 Base 表格（同 Base）
const HR_TABLES = {
  員工基本資料: 'tblSWTahiwhpq0uR',
  人力彙總:     'tblpLG2AS9l1dwVY',
  離職記錄:     'tbl6K6YTOpt2MvfF',
  差勤記錄:     'tblTvIFm0EptwCtR',
};
// 關懷 Base 表格
const CARE_BASE_TOKEN = 'E3X4blbxWa4DaLsSxsClZ3KbgYb'; // 同 base
const CARE_TABLES = {
  員工主檔: 'tblyywSnGtr4m1PO',
  關懷紀錄: 'tblsPbqM9zqQ2UZo',
  績效面談: 'tblLVAg8ddngVF0v',
  承諾追蹤: 'tbliiEFQvWd1IvcU',
  新人關懷: 'tblY8UxWJzXXy4e1',
};

// ── 層級 A：僅 Sherry 可進入 ──
const ALLOWED_PWD  = 'SJAU2B5P';
const ALLOWED_NAME = 'Sherry';

let selectedPeriod = 'current';

// 全域資料
let allCandidates = [], phoneRecords = [], interviewRecords = [], statsRecords = [];
let employees = [], summaries = [], exitList = [], leaveList = [];
let careEmployees = [], careRecords = [], promises = [], newbieRecords = [];
let dataLoaded = false;

// ══════════════════════════════════════
//  Auth — 層級 A + 讀取 localStorage
// ══════════════════════════════════════
function doLogin() {
  const pwd = document.getElementById('auth-input').value.trim();
  if (pwd === ALLOWED_PWD) {
    localStorage.setItem('bb_auth', JSON.stringify({ pwd, role:'hr', name: ALLOWED_NAME }));
    grantAccess();
  } else {
    // 其他所有密碼（含其他 HR、所有主管）→ 無權限
    document.getElementById('auth-error').textContent = '此頁面僅限 HR 管理員（Sherry）使用';
  }
}

function grantAccess() {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('user-name').textContent = ALLOWED_NAME;
  document.getElementById('main-content').style.display = 'block';
  updateMonthBadge();
  initData();
}

function doLogout() {
  localStorage.removeItem('bb_auth');
  location.reload();
}

// 啟動：讀取 localStorage
(function() {
  const saved = localStorage.getItem('bb_auth');
  if (saved) {
    try {
      const u = JSON.parse(saved);
      if (u.pwd === ALLOWED_PWD) { grantAccess(); return; }
      // 其他人有 bb_auth 但非 Sherry → 顯示無權限提示
      showNoAccess();
      return;
    } catch(e) {}
  }
  // 未登入 → 顯示登入框
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('auth-box').style.display = 'block';
  document.getElementById('no-access').style.display = 'none';
})();

function showNoAccess() {
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('auth-box').style.display = 'none';
  document.getElementById('no-access').style.display = 'flex';
}

// ══════════════════════════════════════
//  Helper
// ══════════════════════════════════════
function gf(obj, key) {
  if (!obj || !obj[key]) return null;
  const v = obj[key];
  if (Array.isArray(v)) return v.map(i => typeof i === 'object' ? (i.text || i.name || '') : i).join(', ');
  if (typeof v === 'object' && v.text) return v.text;
  return v;
}
function n(v) { return parseFloat(v) || 0; }

// 本月履歷總數計算規則：
// - 主要來源＝HR搜尋：該行人數＝HR推薦欄位本身，忽略主動應徵_履歷總數（該欄位在此來源下無意義）
// - 主要來源＝104主動應徵（或其他非HR搜尋來源）：HR推薦是從主動應徵_履歷總數篩選出來的子集，
//   只能計入主動應徵_履歷總數，不可再加HR推薦，否則會重複計算
function getStatsTotal(fs) {
  return fs.reduce((a, r) => {
    const active = n(gf(r,'主動應徵_履歷總數'));
    const hr = n(gf(r,'HR推薦'));
    const src = gf(r,'主要來源');
    return a + (src === 'HR搜尋' ? hr : active);
  }, 0);
}
function parseDateVal(v) {
  if (!v) return null;
  if (!isNaN(v)) return new Date(Number(v));
  return new Date(String(v).replace(/\//g, '-').split(' ')[0]);
}
function getPeriodRange(period) {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  switch(period) {
    case 'current': return { start: new Date(y, m, 1),   end: new Date(y, m+1, 0) };
    case 'prev':    return { start: new Date(y, m-1, 1), end: new Date(y, m, 0) };
    case '3m':      return { start: new Date(y, m-2, 1), end: new Date(y, m+1, 0) };
    default:        return null;
  }
}
function filterByPeriod(records, dateField, period) {
  const p = period || selectedPeriod;
  const range = getPeriodRange(p);
  if (!range) return records;
  return records.filter(r => {
    const d = parseDateVal(gf(r, dateField));
    return d && d >= range.start && d <= range.end;
  });
}
function periodLabel(p) {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + 1;
  if (p === 'current') return `${y} 年 ${m} 月`;
  if (p === 'prev') {
    const pm = m === 1 ? 12 : m - 1; const py = m === 1 ? y - 1 : y;
    return `${py} 年 ${pm} 月`;
  }
  return `近三個月`;
}
function updateMonthBadge() {
  document.getElementById('month-badge').textContent = periodLabel(selectedPeriod);

// 姓名正規化：去空白、去 KR- 前綴、小寫（對應「KR- Roy」「Kr-Luka」「Roy」為同一人）
function normName(v){ return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/^kr-/,''); }
// 報告月份：當月／上個月取該月；近三個月取最後一個月
function reportMonthOf(p){
  const ms = periodMonths(p);
  if (ms && ms.length) return ms[ms.length-1];
  const d = new Date(); return { y:d.getFullYear(), m:d.getMonth()+1 };
}
function ymKey(y,m){ return `${y}/${String(m).padStart(2,'0')}`; }

// ── 季度關懷排程（2026 = 6/9/12 月；2027 起 = 3/6/9/12 月）──
function careMonthsOf(y){ return y >= 2027 ? [3,6,9,12] : [6,9,12]; }
function careScheduleLabelOf(y){ return `${y} 年 ${careMonthsOf(y).join('/')} 月`; }
function periodMonths(p){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth()+1;
  if(p==='current') return [{y,m}];
  if(p==='prev'){ const pm=m===1?12:m-1, py=m===1?y-1:y; return [{y:py,m:pm}]; }
  const range=getPeriodRange(p);
  if(!range) return null; // 近半年／整年度／全部：視為涵蓋關懷月
  const months=[]; let d=new Date(range.start.getFullYear(), range.start.getMonth(), 1);
  while(d<=range.end){ months.push({y:d.getFullYear(), m:d.getMonth()+1}); d=new Date(d.getFullYear(), d.getMonth()+1, 1); }
  return months;
}
function isCarePeriod(p){
  const ms=periodMonths(p);
  if(ms===null) return true;
  return ms.some(({y,m})=>careMonthsOf(y).includes(m));
}
function nextCareLabelOf(p){
  const ms=periodMonths(p);
  const ref=(ms && ms[0]) || {y:new Date().getFullYear(), m:new Date().getMonth()+1};
  const up=careMonthsOf(ref.y).find(cm=>cm>=ref.m);
  if(up) return `${ref.y} 年 ${up} 月`;
  const ny=ref.y+1; return `${ny} 年 ${careMonthsOf(ny)[0]} 月`;
}

async function fetchTable(tableId, token) {
  const tk = token || BASE_TOKEN;
  let records = [], pageToken = null;
  do {
    const path = `/open-apis/bitable/v1/apps/${tk}/tables/${tableId}/records?page_size=100${pageToken ? '&page_token=' + pageToken : ''}`;
    const res  = await fetch(WORKER_URL + path);
    const data = await res.json();
    if (data.code !== 0) throw new Error('讀取失敗：' + data.msg);
    records = records.concat(data.data?.items || []);
    pageToken = data.data?.page_token || null;
  } while (pageToken);
  return records.map(r => r.fields);
}

// ── 招募指標 ──
function computeRecruitMetrics() {
  const fc = filterByPeriod(allCandidates, '收件日期');
  const fs = filterByPeriod(statsRecords, '統計日期');
  const fp = filterByPeriod(phoneRecords, '電訪日期');
  const fi = filterByPeriod(interviewRecords, '面試日期');

  const statsTotal = getStatsTotal(fs);
  const total = statsTotal || fc.length;
  const phoneCompleted = fp.filter(r => gf(r,'應徵者')).length;
  const phoneDenom = fc.length;
  const phoneRate = phoneDenom ? Math.round(phoneCompleted / phoneDenom * 100) : null;
  const iReal = fi.filter(r => gf(r,'應徵者')).length;
  const interviewRate = phoneCompleted ? Math.round(iReal / phoneCompleted * 100) : null;
  const dec = fc.filter(c => String(gf(c,'關卡進度')||'').includes('婉拒')).length;
  const lossRate = fc.length ? Math.round(dec / fc.length * 100) : null;
  const phoneScores = fp.map(r => parseFloat(gf(r,'總體評分'))).filter(v => !isNaN(v));
  const avgScore = phoneScores.length ? parseFloat((phoneScores.reduce((a,b)=>a+b,0)/phoneScores.length).toFixed(2)) : null;
  // 開放職缺數：從當月履歷收件統計的「應徵職務」欄位去重，反映本月實際有收件的職缺
  const positions = [...new Set(fs.map(r=>gf(r,'應徵職務')).filter(Boolean))];
  // 錄取結果（職缺補人數皆為 1，有錄取即視為該職缺達標）
  // 注意：錄取評估結果需用精確比對「通過」，避免「不通過」被 includes 誤判
  const isHired = c => {
    const stage  = String(gf(c,'關卡進度')||'');
    const result = String(gf(c,'錄取評估結果')||'').trim();
    const cur    = String(gf(c,'當前關卡')||'').trim();
    return stage.includes('錄取') || result === '通過' || cur === '錄取' || cur === '到職';
  };
  const filledPositions = new Set(allCandidates.filter(isHired).map(c=>gf(c,'應徵職務')).filter(Boolean));
  const periodHires = fc.filter(isHired).map(c=>({ name:gf(c,'應徵者')||'—', job:gf(c,'應徵職務')||'—', onboard:gf(c,'預計到職日')||'' }));
  // 職缺開放/關閉：以面談名單「職缺狀態」欄位為權威來源。
  //  值為「開啟／已關閉」，且逐列填寫（HR 於錄取列標「已關閉」）。
  //  規則：某職缺只要有任一列標「已關閉」即視為已關閉；若該職缺完全未填狀態，回退以「是否已錄取」判斷。
  const isPausedStatus = s => /暫|緩|缓|擱/.test(String(s||''));
  const closedPositions = new Set(
    allCandidates.filter(c => String(gf(c,'職缺狀態')||'').includes('關閉'))
                 .map(c => gf(c,'應徵職務')).filter(Boolean)
  );
  const statusKnownPositions = new Set(
    allCandidates.filter(c => (gf(c,'職缺狀態')||'').trim())
                 .map(c => gf(c,'應徵職務')).filter(Boolean)
  );
  // 職缺狀態權威來源：對「只在履歷收件統計、不在面談名單」的職缺（如暫緩中的 PM／架構師），
  //   以其「最新一列」的職缺狀態欄（若有）或備注欄為準——狀態代表當下狀態，故取最近日期那筆。
  const posLatestStatus = {};
  statsRecords.forEach(r => {
    const p = (gf(r,'應徵職務')||'').trim(); if (!p) return;
    const d = parseDateVal(gf(r,'統計日期')) || new Date(0);
    const st = gf(r,'職缺狀態') || gf(r,'備注') || gf(r,'備註') || '';
    if (!posLatestStatus[p] || d >= posLatestStatus[p].d) posLatestStatus[p] = { d, st };
  });
  Object.entries(posLatestStatus).forEach(([p, o]) => {
    if (String(o.st).includes('關閉')) closedPositions.add(p);
  });
  // 暫緩／擱置職缺：面談名單職缺狀態，或收件統計最新狀態，含「暫／緩／缓／擱」即認定（且非已關閉/未錄取）
  const pausedPositions = new Set(
    allCandidates.filter(c => isPausedStatus(gf(c,'職缺狀態')) && !String(gf(c,'職缺狀態')||'').includes('關閉'))
                 .map(c => gf(c,'應徵職務')).filter(Boolean)
  );
  Object.entries(posLatestStatus).forEach(([p, o]) => {
    if (isPausedStatus(o.st) && !closedPositions.has(p) && !filledPositions.has(p)) pausedPositions.add(p);
  });
  const openUnfilled = positions.filter(p => {
    if (closedPositions.has(p)) return false;           // 已關閉 → 非招募缺口
    if (pausedPositions.has(p)) return false;           // 暫緩擱置 → 非招募缺口（不拉低填補率）
    if (statusKnownPositions.has(p)) return true;        // 有填狀態且非關閉/非暫緩 → 招募中
    return !filledPositions.has(p);                      // 未填狀態 → 回退用錄取判斷
  });

  // ── 成效導向補強（與招募儀表板同一套邏輯）──
  // 每職缺實際進入評估流程人數（＝進面談名單者，本期）
  const posPipeline = {};
  fc.forEach(c => { const p = gf(c,'應徵職務'); if (p) posPipeline[p] = (posPipeline[p]||0)+1; });
  // 每職缺本期收件（來自履歷收件統計）
  const posResume = {};
  fs.forEach(r => { const p = (gf(r,'應徵職務')||'').trim(); if (!p) return;
    posResume[p] = (posResume[p]||0) + (gf(r,'主要來源')==='HR搜尋' ? n(gf(r,'HR推薦')) : n(gf(r,'主動應徵_履歷總數'))); });

  // 填補率分母排除擱置職缺（暫緩者不算在招）
  const activeScope = positions.filter(p => !pausedPositions.has(p));
  const filledCount = activeScope.filter(p => !openUnfilled.includes(p)).length;
  const fillRate = activeScope.length ? Math.round(filledCount / activeScope.length * 100) : null;
  // 擱置職缺與其持續收件（單獨呈現，不進成效判讀）
  const pausedList = positions.filter(p => pausedPositions.has(p));
  const pausedResume = pausedList.reduce((a, p) => a + (posResume[p]||0), 0);

  // 招募精準度（評估效率）＝ 已補實職缺進入評估流程人數 ÷ 本月錄取人數（分母不含達成後持續進件）
  const hireJobs = new Set(periodHires.map(h => h.job).filter(Boolean));
  let evalPipeline = 0;
  hireJobs.forEach(p => { evalPipeline += (posPipeline[p] || 0); });
  const precisionEval = periodHires.length ? +(evalPipeline / periodHires.length).toFixed(1) : null;

  // 達成後持續進件（未進評估）＝ 已補實/已關閉職缺的收件 − 進評估人數（不含擱置職缺）
  const ongoingUnevaluated = activeScope.filter(p => !openUnfilled.includes(p))
    .reduce((a, p) => a + Math.max((posResume[p]||0) - (posPipeline[p]||0), 0), 0);

  // 有效流失 vs 自然未續行：擱置職缺不列入；職缺已達成後其餘婉拒屬正常結案，不計入流失
  let effDeclined = 0, natNonPursue = 0, effBase = 0;
  fc.forEach(c => {
    const p = gf(c,'應徵職務');
    if (p && pausedPositions.has(p)) return;             // 擱置職缺不計入流失判讀
    const isDec = String(gf(c,'關卡進度')||'').includes('婉拒');
    if (p && !openUnfilled.includes(p)) { if (isDec) natNonPursue++; }
    else { effBase++; if (isDec) effDeclined++; }
  });
  const effLossRate = effBase ? Math.round(effDeclined / effBase * 100) : null;
  const rejected = fc.filter(c => gf(c,'關卡進度') === '不通過').length;   // 公司篩選淘汰（非流失）

  // 平均招募週期（天）：已錄取者「招募週期天數」的平均
  const cycleArr = fc.filter(isHired).map(c => parseFloat(gf(c,'招募週期天數'))).filter(v => !isNaN(v) && v > 0);
  const avgCycleDays = cycleArr.length ? Math.round(cycleArr.reduce((a,b)=>a+b,0)/cycleArr.length) : null;

  return { total, phoneRate, interviewRate, lossRate, avgScore, positions, phoneCompleted, phoneDenom, dec, fc, filledPositions, closedPositions, statusKnownPositions, periodHires, openUnfilled,
           filledCount, fillRate, precisionEval, evalPipeline, ongoingUnevaluated, effDeclined, natNonPursue, effBase, effLossRate, rejected, avgCycleDays, posPipeline, posResume,
           pausedPositions, pausedList, pausedResume, activeScope };
}

// ── 人力資源指標 ──
function computeHRMetrics() {
  const fs = filterByPeriod(summaries, '月份');
  const fel = filterByPeriod(exitList, '離職月份');
  const actives = employees.filter(e => gf(e,'在職狀態') === '在職中');
  const latest = fs[fs.length - 1] || {};
  const exitCnt = n(gf(latest,'當月離職人數'));
  const newCnt  = n(gf(latest,'當月新進人數'));
  const activeCnt = n(gf(latest,'當月在職總人數')) || actives.length;
  const cumRate = n(gf(latest,'累計離職率（歷史總覽）'));
  const monthlyRate = activeCnt ? parseFloat((exitCnt / activeCnt * 100).toFixed(1)) : 0;
  const netChange = n(gf(latest,'淨人力變化'));
  const juniorPct = actives.length ? Math.round(actives.filter(e=>gf(e,'年資區間')==='0-1年').length / actives.length * 100) : 0;
  const voluntaryPct = fel.length ? Math.round(fel.filter(e=>gf(e,'離職類型')==='自願離職').length / fel.length * 100) : 0;
  const exitByDept = {}; fel.forEach(e=>{ const d=gf(e,'單位')||'其他'; exitByDept[d]=(exitByDept[d]||0)+1; });
  const maxDeptEntry = Object.entries(exitByDept).sort((a,b)=>b[1]-a[1])[0];
  return { exitCnt, newCnt, activeCnt, cumRate, monthlyRate, netChange, juniorPct, voluntaryPct, maxDeptEntry, actives };
}

// ── 關懷指標 ──
function computeCareMetrics() {
  const frAll = filterByPeriod(careRecords, '面談日期');
  const activeEmps = careEmployees.filter(e => !gf(e,'在職狀態')?.includes('離職'));
  const highRisk = activeEmps.filter(e => gf(e,'當前風險等級')?.includes('高')).length;
  const midRisk  = activeEmps.filter(e => gf(e,'當前風險等級')?.includes('中')).length;
  const empKey = e => normName(gf(e,'英文名')) || normName(gf(e,'Lark 帳號 ID'));
  const empName = e => String(gf(e,'英文名')||gf(e,'員工姓名')||'').trim();
  // 單位主管＝員工主檔「直屬主管」欄位中出現過的名字（以在職員工為準），不列入應關懷人數
  const managerKeys = new Set();
  activeEmps.forEach(e => String(gf(e,'直屬主管')||'').split(/[,、]/).map(normName).filter(Boolean).forEach(k => managerKeys.add(k)));
  // 直屬主管空白（或為 Max）＝主管是執行長：
  //   名字出現在他人「直屬主管」欄 → 單位主管；未出現 → 執行長直屬的一般同仁。兩者皆不列入應關懷人數
  const CEO_KEY = 'max';
  const isUnderCEO = e => { const sup = normName(gf(e,'直屬主管')); return !sup || sup === CEO_KEY; };
  const ceoDirectEmps = activeEmps.filter(e => isUnderCEO(e) && !managerKeys.has(empKey(e)));
  const eligibleEmps = activeEmps.filter(e => !managerKeys.has(empKey(e)) && !isUnderCEO(e));
  const empByKey = {}; eligibleEmps.forEach(e => empByKey[empKey(e)] = e);
  // 計入季度覆蓋率的紀錄：關懷對象為應關懷員工，且面談主管＝該員工直屬主管
  // 非直屬主管進行的關懷（如執行長因應個人表現單獨關懷）屬特殊狀況，不計入
  const fr = [], specialRecs = [];
  frAll.forEach(r => {
    const e = empByKey[normName(gf(r,'關懷員工'))];
    if (!e) return; // 單位主管或非在職者：不列入
    const sup = normName(gf(e,'直屬主管'));
    const interviewer = normName(gf(r,'主管'));
    if (!sup || !interviewer || sup === interviewer) fr.push(r);
    else specialRecs.push({ name: empName(e), interviewer: String(gf(r,'主管')||'').trim(), date: gf(r,'面談日期') });
  });
  const coveredIds = [...new Set(fr.map(r => normName(gf(r,'關懷員工'))))];
  const pendingEmps = eligibleEmps.filter(e => !coveredIds.includes(empKey(e)))
    .map(e => ({ name: empName(e), dept: String(gf(e,'部門')||'').trim(), sup: String(gf(e,'直屬主管')||'').trim() }));
  const coverageRate = eligibleEmps.length ? Math.round(coveredIds.length / eligibleEmps.length * 100) : 0;
  // 季度關懷：非關懷月無關懷紀錄屬正常，覆蓋率不視為缺口
  const isCareMonth = isCarePeriod(selectedPeriod);
  const refYear = (periodMonths(selectedPeriod)?.[0]?.y) || new Date().getFullYear();
  const careScheduleLabel = careScheduleLabelOf(refYear);
  const nextCareLabel = nextCareLabelOf(selectedPeriod);
  return { activeEmps, eligibleEmps, managerCnt: managerKeys.size, ceoDirectEmps: ceoDirectEmps.map(empName), highRisk, midRisk, fr, specialRecs, coverageRate, coveredIds, pendingEmps, isCareMonth, careScheduleLabel, nextCareLabel };
}

// ── 考勤指標（請假＝報告當月；加班＝報告月份＋前兩個月，共三個月）──
function computeAttendanceMetrics() {
  const rmo = reportMonthOf(selectedPeriod);
  const win = [-2,-1,0].map(k => { const d = new Date(rmo.y, rmo.m-1+k, 1); return ymKey(d.getFullYear(), d.getMonth()+1); });
  const curKey = win[2];
  const r1 = v => Math.round(v*10)/10;
  const monthOf = (r, dateF, monthF) => {
    const d = parseDateVal(gf(r,dateF));
    if (d && !isNaN(d)) return ymKey(d.getFullYear(), d.getMonth()+1);
    const m = String(gf(r,monthF)||'').match(/(\d{4})[\/\-](\d{1,2})/);
    return m ? ymKey(+m[1], +m[2]) : '';
  };
  const fmtDate = v => { const d = parseDateVal(v); return d && !isNaN(d) ? `${d.getMonth()+1}/${d.getDate()}` : String(v||''); };
  const who  = r => String(gf(r,'英文名字')||gf(r,'中文姓名')||'').trim();
  const dept = r => String(gf(r,'部門')||'其他').trim();

  // 請假（報告當月）；公出假非請假，另列
  const leaveRecs = leaveList.filter(r => String(gf(r,'假別')||'').trim() && monthOf(r,'請假日期','月份') === curKey);
  const hrsOf = r => n(gf(r,'時數')) || n(gf(r,'天數')) * 8;
  const isTrip = r => String(gf(r,'假別')).includes('公出');
  const leaves = leaveRecs.filter(r => !isTrip(r)), trips = leaveRecs.filter(isTrip);
  const leaveByType = {}; leaves.forEach(r => { const t=String(gf(r,'假別')).trim(); leaveByType[t]=r1((leaveByType[t]||0)+hrsOf(r)); });
  const leave = {
    recs: leaves.length, persons: new Set(leaves.map(who)).size, hours: r1(leaves.reduce((a,r)=>a+hrsOf(r),0)),
    byType: leaveByType, tripRecs: trips.length, tripHours: r1(trips.reduce((a,r)=>a+hrsOf(r),0))
  };

  // 加班（三個月窗口）
  const otRecs = leaveList.filter(r => n(gf(r,'加班時數')) > 0)
    .map(r => ({ month: monthOf(r,'加班日期','加班月份'), who: who(r), dept: dept(r), type: String(gf(r,'加班類型')||'未分類').trim(), hours: n(gf(r,'加班時數')), date: fmtDate(gf(r,'加班日期')) }))
    .filter(o => win.includes(o.month));
  const byMonth = {};
  win.forEach(k => byMonth[k] = { recs:0, persons:new Set(), hours:0, byType:{}, byDept:{}, byPerson:{} });
  otRecs.forEach(o => {
    const b = byMonth[o.month]; b.recs++; b.persons.add(o.who); b.hours += o.hours;
    b.byType[o.type] = (b.byType[o.type]||0) + o.hours;
    b.byDept[o.dept] = (b.byDept[o.dept]||0) + o.hours;
    b.byPerson[o.who] = (b.byPerson[o.who]||0) + o.hours;
  });
  const months = win.map(k => {
    const b = byMonth[k];
    const top = Object.entries(b.byPerson).sort((a,c)=>c[1]-a[1])[0];
    const rnd = o => Object.fromEntries(Object.entries(o).sort((a,c)=>c[1]-a[1]).map(([x,v])=>[x,r1(v)]));
    return { key:k, recs:b.recs, persons:b.persons.size, hours:r1(b.hours), byType:rnd(b.byType), byDept:rnd(b.byDept), top: top ? { who:top[0], hours:r1(top[1]) } : null, byPerson:b.byPerson };
  });
  const cur = months[2], prev = months[1];
  const momPct = prev.hours > 0 ? Math.round((cur.hours - prev.hours) / prev.hours * 100) : null;
  const personTotal = {}, personMonths = {};
  otRecs.forEach(o => { personTotal[o.who]=(personTotal[o.who]||0)+o.hours; (personMonths[o.who] = personMonths[o.who] || new Set()).add(o.month); });
  const multiMonth = Object.entries(personMonths).filter(([,ms]) => ms.size >= 2).map(([w,ms]) => ({ who:w, months:ms.size, hours:r1(personTotal[w]) }));
  // 工時合規：單月 46h、三個月合計 138h
  const monthOver = []; months.forEach(m => Object.entries(m.byPerson).forEach(([w,h]) => { if (h > 46) monthOver.push({ month:m.key, who:w, hours:r1(h) }); }));
  const triOver = Object.entries(personTotal).filter(([,h]) => h > 138).map(([w,h]) => ({ who:w, hours:r1(h) }));
  // 例假日／國定假日出勤：需核對事由、報備與補休
  const holidayRecs = otRecs.filter(o => o.type.includes('例假') || o.type.includes('國定'));
  // 平日加班 ≥ 4h：正常工時 8h + 加班 4h 可能觸及單日 12h 上限，需對照出勤紀錄人工核對
  const longDayRecs = otRecs.filter(o => o.type.includes('平日') && o.hours >= 4);
  return {
    curKey, win, leave, months, cur, momPct,
    total: { recs: otRecs.length, persons: Object.keys(personTotal).length, hours: r1(otRecs.reduce((a,o)=>a+o.hours,0)) },
    multiMonth, monthOver, triOver, holidayRecs, longDayRecs,
    emptyMonths: months.filter(m => m.recs === 0).map(m => m.key)
  };
}

// ══════════════════════════════════════
//  風險整合計算
// ══════════════════════════════════════
function computeAllRisks(rm, hm, cm, am) {
  const risks = [];

  // ── 考勤風險（僅法定上限超標才列入）──
  if (am && am.monthOver.length)
    risks.push({ level:'high', icon:'⏱', source:'考勤', title:'單月加班超過 46 小時上限', metric: am.monthOver.map(o=>`${o.who}（${o.month}：${o.hours}h）`).join('、'), desc:`已超出勞基法單月加班上限，請立即與主管確認工作分配並調整排班。` });
  if (am && am.triOver.length)
    risks.push({ level:'high', icon:'⏱', source:'考勤', title:'三個月加班合計超過 138 小時', metric: am.triOver.map(o=>`${o.who}（${o.hours}h）`).join('、'), desc:`三個月累計加班超出上限，請檢視人力配置。` });

  // ── 人力資源風險 ──
  if (hm.monthlyRate > 10)
    risks.push({ level:'high', icon:'🔥', source:'人力資源', title:'本月離職率過高', metric:`離職率 ${hm.monthlyRate}%（${hm.exitCnt} 人）`, desc:`當月離職人數偏高，若持續超過 10% 將嚴重影響服務能量與交接品質，建議本週緊急召開部門主管會議評估原因。` });
  else if (hm.monthlyRate > 5 && hm.exitCnt >= 2)
    risks.push({ level:'medium', icon:'⚠️', source:'人力資源', title:'本月離職率偏高', metric:`離職率 ${hm.monthlyRate}%（${hm.exitCnt} 人）`, desc:`當月離職比例高於健康水準（< 5%），需追蹤是否為連續趨勢。` });

  if (hm.netChange < 0 && hm.newCnt < hm.exitCnt)
    risks.push({ level:'high', icon:'📉', source:'人力資源', title:'淨人力持續負成長', metric:`淨變化 ${hm.netChange}，新進 ${hm.newCnt} < 離職 ${hm.exitCnt}`, desc:`補充人力速度跟不上流失速度，若招募管線未能及時填補，將造成業務超載與品質下滑。` });

  if (hm.juniorPct > 30)
    risks.push({ level:'medium', icon:'🌱', source:'人力資源', title:'新進員工比例偏高', metric:`年資 0-1 年佔在職 ${hm.juniorPct}%`, desc:`大量新進員工需要較多培訓資源，短期內可能影響整體生產力，建議啟動配對導師制。` });

  // ── 招募風險（職缺補人數皆為 1，有錄取即達標；僅在仍有未補實職缺時才視為風險）──
  if (rm.openUnfilled.length > 0) {
    if (rm.total < 10)
      risks.push({ level:'high', icon:'📥', source:'招募管理', title:'開放職缺收件量不足', metric:`本月收件 ${rm.total} 份（目標 ≥ 10 份），未補實職缺：${rm.openUnfilled.join('、')}`, desc:`仍有職缺未錄取且收件量偏低，將導致後續各關卡候選人稀缺，建議立即擴大招募渠道。` });
    else if (rm.total < 20)
      risks.push({ level:'medium', icon:'📊', source:'招募管理', title:'開放職缺收件量偏低', metric:`本月收件 ${rm.total} 份，未補實職缺：${rm.openUnfilled.join('、')}`, desc:`收件量雖達最低門檻，但相對於未補實職缺需求仍屬偏低，建議調整刊登策略。` });

    // 小樣本（進流程 < 10 人）比率波動過大，不單以百分比判定高風險
    // 流失以「有效流失率」為準：只計尚未補實職缺的主動婉拒；自然未續行/公司不通過不計入
    if (rm.effLossRate !== null && rm.effLossRate > 30 && rm.effBase >= 10)
      risks.push({ level:'high', icon:'🚪', source:'招募管理', title:'有效流失率超標', metric:`有效流失率 ${rm.effLossRate}%（未補實職缺中 ${rm.effDeclined} 位主動婉拒）`, desc:`尚未補實的職缺仍有候選人主動婉拒，建議縮短決策週期並了解薪資期望落差。` });

    if (rm.phoneRate !== null && rm.phoneRate < 60 && rm.fc.length >= 10)
      risks.push({ level:'medium', icon:'📞', source:'招募管理', title:'電訪完成率偏低', metric:`電訪完成率 ${rm.phoneRate}%，目標 ≥ 60%`, desc:`電訪接通率未達標，可能為聯絡時段不佳或求職者意願低落，建議調整電訪時段與話術。` });
  }

  // ── 員工關懷風險 ──
  if (cm.highRisk > 0) {
    const names = careEmployees.filter(e=>gf(e,'當前風險等級')?.includes('高')).map(e=>(gf(e,'英文名')||gf(e,'員工姓名')||'').trim()).filter(Boolean).join('、');
    risks.push({ level:'high', icon:'🔴', source:'員工關懷', title:'高留任風險員工需立即關懷', metric:`共 ${cm.highRisk} 位：${names || '詳見關懷系統'}`, desc:`高風險員工若未及時關懷介入，離職機率顯著提升，請主管本週內安排 1on1，HR 同步追蹤。` });
  }

  if (cm.midRisk >= 2)
    risks.push({ level:'medium', icon:'🟡', source:'員工關懷', title:'中風險員工持續追蹤中', metric:`共 ${cm.midRisk} 位中風險員工`, desc:`中風險員工若連續兩次評估未改善，建議主管縮短關懷頻率為每月一次，持續追蹤。` });

  return risks.sort((a,b) => ({'high':0,'medium':1,'low':2}[a.level] - {'high':0,'medium':1,'low':2}[b.level]));
}

// ══════════════════════════════════════
//  渲染
// ══════════════════════════════════════
function renderAll() {
  if (!dataLoaded) return;
  updateMonthBadge();
  const rm = computeRecruitMetrics();
  const hm = computeHRMetrics();
  const cm = computeCareMetrics();
  const am = computeAttendanceMetrics();
  const risks = computeAllRisks(rm, hm, cm, am);
  renderKPIStrip(rm, hm, cm, am);
  renderBlockGrid(rm, hm, cm, am);
  renderRiskList(risks);
  renderActions(risks, rm, hm, cm);
}

function tagClass(ok, warn) {
  if (ok === null) return 'tag-info';
  return ok ? 'tag-ok' : (warn ? 'tag-warn' : 'tag-danger');
}
function tagText(ok, val, unit) {
  if (ok === null) return '待確認';
  return ok ? '達標' : '未達標';
}

function renderKPIStrip(rm, hm, cm, am) {
  const cards = [
    {
      cls:'hr', label:'本月在職人數', val: hm.activeCnt, unit:'人',
      sub: `離職 ${hm.exitCnt} 人・淨變化 ${hm.netChange >= 0 ? '+':''}${hm.netChange}`,
      tagCls: hm.exitCnt <= 1 ? 'tag-ok' : hm.monthlyRate > 10 ? 'tag-danger' : 'tag-warn',
      tagTxt: hm.exitCnt === 0 ? '無異動' : `離職 ${hm.exitCnt} 人`
    },
    {
      cls:'att', label:'本月加班時數', val: am.cur.hours, unit:'h',
      sub: `加班 ${am.cur.persons} 人・${am.cur.recs} 筆${am.momPct !== null ? `・較上月 ${am.momPct >= 0 ? '+' : ''}${am.momPct}%` : ''}`,
      tagCls: (am.monthOver.length || am.triOver.length) ? 'tag-danger' : 'tag-ok',
      tagTxt: (am.monthOver.length || am.triOver.length) ? '超過上限' : '合規'
    },
    {
      cls:'recruit', label:'本月履歷收件', val: rm.total, unit:'份',
      sub: rm.periodHires.length
        ? `本月錄取 ${rm.periodHires.length} 人・精準度 ${rm.precisionEval !== null ? rm.precisionEval + ' 人/錄取' : '—'}${rm.avgCycleDays !== null ? '・' + rm.avgCycleDays + ' 天' : ''}`
        : `電訪完成率 ${rm.phoneRate !== null ? rm.phoneRate + '%' : '暫無'}`,
      tagCls: rm.openUnfilled.length === 0 ? 'tag-ok' : (rm.total >= 10 ? 'tag-ok' : 'tag-danger'),
      tagTxt: rm.openUnfilled.length === 0 ? '職缺達標' : (rm.total >= 10 ? '達標' : '收件不足')
    },
    {
      cls:'care', label:'高留任風險員工', val: cm.highRisk, unit:'人',
      sub: cm.isCareMonth ? `中風險 ${cm.midRisk} 人・關懷覆蓋率 ${cm.coverageRate}%（${cm.coveredIds.length}/${cm.eligibleEmps.length}）` : `中風險 ${cm.midRisk} 人・本月非關懷月`,
      tagCls: cm.highRisk === 0 ? 'tag-ok' : 'tag-danger',
      tagTxt: cm.highRisk === 0 ? '良好' : '需立即處理'
    },
  ];
  document.getElementById('kpi-strip').innerHTML = cards.map(c => `
    <div class="kpi-card ${c.cls}" style="animation:fadeUp .4s ease both">
      <div class="kpi-card-label">${c.label}</div>
      <div class="kpi-card-val" style="color:var(--navy)">${c.val}<span style="font-size:14px;font-weight:400;color:var(--text-sub);margin-left:2px">${c.unit}</span></div>
      <div class="kpi-card-sub">${c.sub}</div>
      <span class="kpi-card-tag ${c.tagCls}">${c.tagTxt}</span>
    </div>`).join('');
}

function renderBlockGrid(rm, hm, cm, am) {
  const hrRows = [
    { label:'本月在職人數',    val: hm.activeCnt + ' 人', cls: '' },
    { label:'本月離職人數',    val: hm.exitCnt + ' 人',  cls: hm.exitCnt >= 3 ? 'red' : hm.exitCnt >= 1 ? 'amber' : 'teal' },
    { label:'本月新進人數',    val: hm.newCnt + ' 人',   cls: 'teal' },
    { label:'當月離職率',      val: hm.monthlyRate + '%', cls: hm.monthlyRate > 10 ? 'red' : hm.monthlyRate > 5 ? 'amber' : 'teal' },
    { label:'新進員工佔比',    val: hm.juniorPct + '%',   cls: hm.juniorPct > 30 ? 'amber' : '' },
    { label:'自願離職佔比',    val: hm.exitCnt > 0 ? hm.voluntaryPct + '%' : '—', cls: '' },
  ];
  const recruitRows = [
    { label:'收件總數',        val: rm.total + ' 份' + (rm.ongoingUnevaluated > 0 ? `（含達成後持續進件 ${rm.ongoingUnevaluated} 份）` : ''), cls: (rm.openUnfilled.length === 0 || rm.total >= 10) ? 'teal' : 'red' },
    { label:'本月錄取',        val: rm.periodHires.length ? rm.periodHires.map(h=>h.name).join('、') : '—', cls: rm.periodHires.length ? 'teal' : '' },
    { label:'職缺填補率',      val: rm.fillRate !== null ? `${rm.fillRate}%（${rm.filledCount}/${rm.activeScope.length}）` + (rm.pausedList.length ? `　擱置 ${rm.pausedList.length} 缺不列入` : '') : '—', cls: rm.fillRate === 100 ? 'teal' : rm.fillRate > 0 ? 'amber' : '' },
    { label:'招募精準度',      val: rm.precisionEval !== null ? `${rm.precisionEval} 人/錄取` : '暫無', cls: rm.precisionEval !== null ? 'teal' : '' },
    { label:'平均招募週期',    val: rm.avgCycleDays !== null ? `${rm.avgCycleDays} 天` : '暫無', cls: rm.avgCycleDays !== null ? 'teal' : '' },
    { label:'電訪完成率',      val: rm.phoneRate !== null ? rm.phoneRate + '%' : '暫無', cls: rm.phoneRate !== null ? (rm.phoneRate >= 60 ? 'teal' : 'amber') : '' },
    { label:'初試達成率',      val: rm.interviewRate !== null ? rm.interviewRate + '%' : '暫無', cls: rm.interviewRate !== null ? (rm.interviewRate >= 60 ? 'teal' : 'amber') : '' },
    { label:'有效流失率',      val: rm.effLossRate !== null ? `${rm.effLossRate}%` + (rm.natNonPursue > 0 ? `（另 ${rm.natNonPursue} 人自然未續行）` : '') : (rm.natNonPursue > 0 ? `0%（${rm.natNonPursue} 人自然未續行）` : '暫無'), cls: rm.effLossRate === null || rm.effLossRate <= 30 ? 'teal' : 'red' },
    { label:'電訪平均評分',    val: rm.avgScore !== null ? rm.avgScore + ' / 5' : '暫無', cls: rm.avgScore !== null ? (rm.avgScore >= 3.5 ? 'teal' : 'amber') : '' },
    { label:'職缺狀態',        val: rm.positions.length ? rm.positions.map(p=> rm.pausedPositions.has(p) ? `${p}（暫緩）` : rm.openUnfilled.includes(p) ? `${p}（招募中）` : `${p}（已關閉）`).join('、') : '本月無收件職缺', cls: (rm.activeScope.length && rm.openUnfilled.length === 0) ? 'teal' : '' },
  ];
  const careRows = [
    { label:'應關懷人數',      val: `${cm.eligibleEmps.length} 人（不含單位主管 ${cm.managerCnt} 人、執行長直屬 ${cm.ceoDirectEmps.length} 人）`, cls: '' },
    { label:'高留任風險',      val: cm.highRisk + ' 人', cls: cm.highRisk > 0 ? 'red' : 'teal' },
    { label:'中留任風險',      val: cm.midRisk + ' 人',  cls: cm.midRisk >= 2 ? 'amber' : '' },
    { label:'本月關懷次數',    val: cm.fr.length + ' 次' + (cm.specialRecs.length ? `（另特殊關懷 ${cm.specialRecs.length} 次不計入）` : ''), cls: !cm.isCareMonth ? '' : (cm.fr.length > 0 ? 'teal' : 'amber') },
    cm.isCareMonth
      ? { label:'關懷覆蓋率', val: `${cm.coverageRate}%（${cm.coveredIds.length}/${cm.eligibleEmps.length}）`, cls: cm.coverageRate >= 80 ? 'teal' : cm.coverageRate >= 50 ? 'amber' : 'red' }
      : { label:'關懷覆蓋率', val: '非關懷月', cls: '' },
    ...(cm.isCareMonth && cm.pendingEmps.length ? [{ label:'待完成面談', val: cm.pendingEmps.map(e=>`${e.name}（${e.dept}）`).join('、'), cls: 'amber' }] : []),
    { label:'關懷排程',        val: cm.isCareMonth ? '本月為關懷月' : `下次：${cm.nextCareLabel}`, cls: '' },
  ];
  const fmtObj = o => Object.entries(o).map(([k,v])=>`${k} ${v}h`).join('、') || '—';
  const attRows = [
    { label:'本月請假',        val: `${am.leave.persons} 人・${am.leave.recs} 筆・${am.leave.hours}h`, cls: '' },
    { label:'請假假別',        val: fmtObj(am.leave.byType), cls: '' },
    { label:'本月加班',        val: `${am.cur.persons} 人・${am.cur.recs} 筆・${am.cur.hours}h`, cls: '' },
    { label:'加班類型',        val: fmtObj(am.cur.byType), cls: '' },
    { label:'三個月加班合計',  val: `${am.total.persons} 人・${am.total.recs} 筆・${am.total.hours}h（${am.win[0]}–${am.win[2]}）`, cls: '' },
    { label:'工時上限（46h／138h）', val: (am.monthOver.length || am.triOver.length) ? '有超標' : '無超標', cls: (am.monthOver.length || am.triOver.length) ? 'red' : 'teal' },
    { label:'例假日／國定假日出勤', val: am.holidayRecs.length ? am.holidayRecs.map(o=>`${o.who} ${o.date} ${o.type} ${o.hours}h`).join('、') : '無', cls: am.holidayRecs.length ? 'amber' : 'teal' },
  ];

  function buildBlock(icon, title, color, rows) {
    return `<div class="block-panel" style="animation:fadeUp .5s ease both">
      <div class="block-panel-title"><span style="color:${color}">${icon}</span> ${title}</div>
      ${rows.map(r => `<div class="metric-row">
        <span class="metric-label">${r.label}</span>
        <span class="metric-val ${r.cls}">${r.val}</span>
      </div>`).join('')}
    </div>`;
  }

  document.getElementById('block-grid').innerHTML =
    buildBlock('👥', '人力資源', '#3B8BD4', hrRows) +
    buildBlock('🕒', '考勤儀表板', '#BA7517', attRows) +
    buildBlock('📋', '招募管理', '#1D9E75', recruitRows) +
    buildBlock('💚', '員工關懷', '#6B4FA0', careRows);
}

function renderRiskList(risks) {
  if (!risks.length) {
    document.getElementById('risk-list').innerHTML = `
      <div style="background:var(--teal-light);border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">✅</span>
        <div>
          <div style="font-weight:700;font-size:13px;color:var(--teal)">本月各項指標均在健康範圍</div>
          <div style="font-size:12px;color:#5F5E5A;margin-top:3px">請維持現有人力管理節奏，持續追蹤關鍵指標。</div>
        </div>
      </div>`;
    return;
  }
  document.getElementById('risk-list').innerHTML = risks.map(r => `
    <div class="risk-item ${r.level}" style="animation:fadeUp .4s ease both">
      <div class="risk-icon">${r.icon}</div>
      <div class="risk-body">
        <div class="risk-header">
          <span class="risk-level-badge">${r.level === 'high' ? '高風險' : r.level === 'medium' ? '中風險' : '低風險'}</span>
          <span class="risk-source-badge">${r.source}</span>
          <span class="risk-title">${r.title}</span>
        </div>
        <div class="risk-metric">${r.metric}</div>
        <div class="risk-desc">${r.desc}</div>
      </div>
    </div>`).join('');
}

function renderActions(risks, rm, hm, cm) {
  const actions = [];
  const tags = risks.map(r => r.source + ':' + r.title);

  if (hm.exitCnt > 0 || (rm.effLossRate !== null && rm.effLossRate > 20 && rm.openUnfilled.length > 0 && rm.effBase >= 10))
    actions.push({ icon:'🤝', title:'縮短決策週期・降低人才流失', tag:'短期・本週優先',
      body:`<li>電訪評分 ≥ 4 分的候選人，建議 <strong>3 個工作日內</strong> 完成主管面試安排</li>
            <li>離職員工進行<strong>離職訪談</strong>，記錄原因並每月彙整一次呈報管理層</li>
            <li>若多人因薪資婉拒，啟動 <strong>薪資結構檢討</strong>，對比市場行情</li>`,
      steps:['確認主管面試檔期','完成離職訪談記錄','啟動薪資校準評估'] });

  if (cm.highRisk > 0)
    actions.push({ icon:'💬', title:'高風險員工關懷介入', tag:'緊急・立即執行',
      body:`<li>高風險員工請主管 <strong>本週內</strong> 安排 1on1，並將面談記錄同步至關懷系統</li>
            <li>主管將面談重點與後續安排同步填入關懷紀錄，HR 定期檢視</li>
            <li>HR 獨立約談高風險員工，了解主管無法得知的深層狀況</li>`,
      steps:['主管本週安排 1on1','同步關懷紀錄','HR 獨立約談'] });

  if (rm.total < 20 && rm.openUnfilled.length > 0)
    actions.push({ icon:'📢', title:'擴大招募渠道・提升收件量', tag:'短期・立即執行',
      body:`<li>同步開啟 <strong>LinkedIn、CakeResume、Yourator</strong> 刊登，避免依賴單一平台</li>
            <li>請部門主管協助 <strong>內部轉介</strong>，推薦潛力人才</li>
            <li>評估是否調整 JD 措辭，降低不必要的硬性條件以擴大應徵母數</li>`,
      steps:['多平台同步刊登','啟動員工轉介','審視並優化 JD'] });

  if (hm.netChange < 0)
    actions.push({ icon:'⚡', title:'加速招募填補人力缺口', tag:'中期・本月追蹤',
      body:`<li>確認各職缺的優先填補順序，集中資源在最急迫的職位</li>
            <li>縮短面試流程，電訪後 <strong>48 小時內</strong> 完成邀約，7 天內確定主管面試日</li>
            <li>建立備援候選人名單，避免最終錄取者拒絕後管道斷流</li>`,
      steps:['職缺優先排序','48h 內完成邀約','建立候選人備援池'] });

  if (hm.juniorPct > 25)
    actions.push({ icon:'🌱', title:'新進員工培育計畫', tag:'中期・本季執行',
      body:`<li>啟動配對導師制，每位新進員工指定 1 位資深同仁擔任 Buddy</li>
            <li>HR 安排入職 30/60/90 天節點關懷，了解適應狀況</li>
            <li>主管納入新人里程碑追蹤，確保培育進度符合預期</li>`,
      steps:['建立 Buddy 制度','入職三節點關懷','主管里程碑追蹤'] });

  if (!actions.length)
    actions.push({ icon:'✅', title:'維持現有管理節奏', tag:'持續執行',
      body:`<li>本月各項指標均在健康範圍，建議持續維持現有招募、關懷與人力管理頻率</li>
            <li>每月定期檢視儀表板數據，提前發現潛在風險</li>
            <li>持續蒐集員工意見，作為下季人力策略的參考依據</li>`,
      steps:['定期儀表板檢視','蒐集員工意見','下季策略規劃'] });

  document.getElementById('action-grid').innerHTML = actions.map(a => `
    <div class="action-card" style="animation:fadeUp .5s ease both">
      <div class="action-header">
        <div class="action-icon">${a.icon}</div>
        <div class="action-meta">
          <div class="action-title">${a.title}</div>
          <div class="action-tag">${a.tag}</div>
        </div>
      </div>
      <ul class="action-body">${a.body}</ul>
      <div class="action-steps">${a.steps.map(s=>`<span class="action-step">${s}</span>`).join('')}</div>
    </div>`).join('');
}

// 複製格式化數據給 Claude Project 使用
function copyDataForAI() {
  const rm = computeRecruitMetrics();
  const hm = computeHRMetrics();
  const cm = computeCareMetrics();
  const am = computeAttendanceMetrics();
  const risks = computeAllRisks(rm, hm, cm, am);
  const period = periodLabel(selectedPeriod);
  const fmtObj = o => Object.entries(o).map(([k,v])=>`${k} ${v}h`).join('、') || '無';
  const otMonthLine = m => m.recs
    ? `- ${m.key}：加班 ${m.persons} 人、${m.recs} 筆，合計 ${m.hours} 小時｜類型：${fmtObj(m.byType)}｜單位：${fmtObj(m.byDept)}｜個人最高：${m.top.who} ${m.top.hours}h`
    : `- ${m.key}：無加班紀錄`;

  const text =
`【${period} 人力資源數據】

■ 人力資源
- 本月在職人數：${hm.activeCnt} 人
- 本月離職人數：${hm.exitCnt} 人（離職率 ${hm.monthlyRate}%）
- 本月新進人數：${hm.newCnt} 人（淨人力變化：${hm.netChange >= 0 ? '+' : ''}${hm.netChange}）
- 年資 0-1 年員工佔比：${hm.juniorPct}%
- 自願離職佔本月離職：${hm.exitCnt > 0 ? hm.voluntaryPct + '%' : '無離職'}

■ 考勤儀表板（${am.curKey}）
- 本月請假：${am.leave.persons} 人、${am.leave.recs} 筆，合計 ${am.leave.hours} 小時｜假別：${fmtObj(am.leave.byType)}${am.leave.tripRecs ? `\n- 公出（非請假，另列）：${am.leave.tripRecs} 筆、${am.leave.tripHours} 小時` : ''}
- 本月加班：${am.cur.persons} 人、${am.cur.recs} 筆，合計 ${am.cur.hours} 小時${am.momPct !== null ? `（較上月 ${am.momPct >= 0 ? '+' : ''}${am.momPct}%）` : ''}
- 工時上限：${(am.monthOver.length || am.triOver.length) ? '有超標，詳見加班分析' : '單月 46 小時、三個月 138 小時皆無超標'}

■ 招募管理
- 本月收件總數：${rm.total} 份（目標 ≥ 10 份）${rm.ongoingUnevaluated > 0 ? `，其中 ${rm.ongoingUnevaluated} 份為「達成後持續進件」（職缺已補實、104 刊登未關閉，未進入評估流程，屬正常現象）` : ''}
- 本月錄取：${rm.periodHires.length ? rm.periodHires.map(h=>`${h.name}（${h.job}${h.onboard ? '・預計到職 ' + h.onboard : ''}）`).join('、') : '無'}
- 職缺填補率：${rm.fillRate !== null ? `${rm.fillRate}%（已補實 ${rm.filledCount}／在招 ${rm.activeScope.length} 個職缺；擱置職缺不列入分母）` : '暫無資料'}
- 招募精準度（評估效率）：${rm.precisionEval !== null ? `每 1 位錄取平均評估 ${rm.precisionEval} 位候選人（分母為進入評估流程人數，不含達成後持續進件；數值越低＝來源越精準）` : '暫無資料（本月尚無錄取）'}
- 平均招募週期：${rm.avgCycleDays !== null ? rm.avgCycleDays + ' 天（收件至錄取）' : '暫無資料'}
- 電訪完成率：${rm.phoneRate !== null ? rm.phoneRate + '%' : '暫無資料'}（目標 ≥ 60%）
- 初試達成率：${rm.interviewRate !== null ? rm.interviewRate + '%' : '暫無資料'}（目標 ≥ 60%）
- 有效流失率：${rm.effLossRate !== null ? rm.effLossRate + '%' : '0%'}（目標 ≤ 30%；僅計「尚未補實職缺」的主動婉拒）${rm.natNonPursue > 0 ? `；另有 ${rm.natNonPursue} 人屬「自然未續行」（職缺已補實後其餘人選未再推進，非流失）` : ''}${rm.rejected > 0 ? `；另有 ${rm.rejected} 人為公司篩選不通過（正常淘汰，非流失）` : ''}
- 電訪平均評分：${rm.avgScore !== null ? rm.avgScore + ' / 5' : '暫無資料'}（目標 ≥ 3.5）
- 職缺狀態：${rm.positions.length ? rm.positions.map(p=> rm.pausedPositions.has(p) ? `${p}（暫緩擱置）` : rm.openUnfilled.includes(p) ? `${p}（招募中）` : `${p}（已關閉）`).join('、') : '本月無收件職缺'}${rm.pausedList.length ? `
- 擱置職缺持續收件：${rm.pausedList.join('、')} 共收 ${rm.pausedResume} 份（職缺暫緩、刊登開放持續收履歷但不進面試流程，屬刻意擱置，不計入招募缺口與填補率）` : ''}
- 招募判讀提醒：職缺是否仍需招募，以「職缺狀態」為準——「已關閉」＝已補實或結案；「暫緩擱置」＝刻意暫停、持續收件但不進流程；兩者皆不得判為招募缺口或「收件嚴重不足」，也不列入填補率分母。只有「招募中」且未補實的職缺，收件量過低才算議題。評估效率請以「招募精準度」判讀（進入評估流程人數÷錄取），不可用收件總量除以錄取數（會被達成後持續進件與擱置收件稀釋而失真）。流失請以「有效流失率」判讀，「自然未續行」與「公司篩選不通過」皆非招募流失，不得計入。小樣本（進流程 < 10 人）的比率指標波動大，不得單以百分比判定為高風險。

■ 員工關懷
- 關懷制度：季度關懷（${cm.careScheduleLabel}），主管每季進行一次 1on1 關懷面談
- 應關懷人數：${cm.eligibleEmps.length} 人（在職 ${cm.activeEmps.length} 人，扣除單位主管 ${cm.managerCnt} 人、執行長直屬同仁 ${cm.ceoDirectEmps.length} 人${cm.ceoDirectEmps.length ? '：' + cm.ceoDirectEmps.join('、') : ''}；單位主管＝員工主檔「直屬主管」欄出現的名字，直屬主管空白＝主管為執行長 Max）
- 高留任風險員工：${cm.highRisk} 人
- 中留任風險員工：${cm.midRisk} 人
- 本月關懷狀態：${cm.isCareMonth ? `本月為關懷月，已完成 ${cm.coveredIds.length} 人，關懷覆蓋率 ${cm.coverageRate}%（${cm.coveredIds.length}/${cm.eligibleEmps.length}）${cm.pendingEmps.length ? `；尚未完成 ${cm.pendingEmps.length} 人：${cm.pendingEmps.map(e=>`${e.name}（${e.dept}／主管 ${e.sup || "未填"}）`).join('、')}` : ''}` : `本月為非關懷月（下次關懷月：${cm.nextCareLabel}），無關懷紀錄屬正常，不得判定為關懷不足、關懷覆蓋率過低或員工關懷高風險`}${cm.specialRecs.length ? `
- 特殊關懷（不計入季度覆蓋率與風險統計）：${cm.specialRecs.map(r=>`${r.name}（由 ${r.interviewer} 進行）`).join('、')}——非直屬主管進行的個別關懷，屬特殊狀況` : ''}
- 關懷判讀提醒：關懷紀錄中的「主管承諾」欄為主管紀錄用途，並非正式承諾，不得列為風險、不得要求回覆期限，也不需追蹤兌現狀況。

■ 加班分析（${am.win[0]}–${am.win[2]}，報告月份＋前兩個月）
${am.months.map(otMonthLine).join('\n')}
- 三個月合計：${am.total.persons} 人、${am.total.recs} 筆，共 ${am.total.hours} 小時${am.multiMonth.length ? `；跨月皆有加班：${am.multiMonth.map(p=>`${p.who}（${p.months} 個月，累計 ${p.hours}h）`).join('、')}` : ''}
- 單月 46 小時上限：${am.monthOver.length ? '超標 ' + am.monthOver.map(o=>`${o.who}（${o.month} ${o.hours}h）`).join('、') : '無人超標'}
- 三個月 138 小時上限：${am.triOver.length ? '超標 ' + am.triOver.map(o=>`${o.who}（${o.hours}h）`).join('、') : '無人超標'}
- 例假日／國定假日出勤（需核對事由與報備；例假日須另給補休）：${am.holidayRecs.length ? am.holidayRecs.map(o=>`${o.who}（${o.dept}）${o.date} ${o.type} ${o.hours}h`).join('、') : '無'}
- 平日加班 ≥ 4 小時（需對照出勤紀錄核對單日總工時是否超過 12 小時）：${am.longDayRecs.length ? am.longDayRecs.map(o=>`${o.who} ${o.date} ${o.hours}h`).join('、') : '無'}${am.emptyMonths.length ? `\n- 註：${am.emptyMonths.join('、')} 無加班紀錄` : ''}

■ 本月主要風險
${risks.length > 0 ? risks.map(r => `- [${r.level === 'high' ? '高' : r.level === 'medium' ? '中' : '低'}風險][${r.source}] ${r.title}：${r.metric}`).join('\n') : '- 本月無顯著風險'}`;

  const btn = document.getElementById('copy-ai-btn');
  navigator.clipboard.writeText(text).then(() => {
    btn.querySelector('.btn-text').textContent = '✅ 已複製！貼入 Claude Project';
    setTimeout(() => btn.querySelector('.btn-text').textContent = '📋 複製數據給 AI', 3000);
  }).catch(() => {
    btn.querySelector('.btn-text').textContent = '❌ 複製失敗，請重試';
    setTimeout(() => btn.querySelector('.btn-text').textContent = '📋 複製數據給 AI', 2000);
  });
}

function copyReportText() {
  const rm = computeRecruitMetrics();
  const hm = computeHRMetrics();
  const cm = computeCareMetrics();
  const am = computeAttendanceMetrics();
  const period = periodLabel(selectedPeriod);
  const text = `【${period} 月度人力資源報告數據摘要】\n\n` +
    `人力資源：在職 ${hm.activeCnt} 人・離職 ${hm.exitCnt} 人・新進 ${hm.newCnt} 人・離職率 ${hm.monthlyRate}%\n` +
    `考勤：請假 ${am.leave.persons} 人・${am.leave.hours}h・加班 ${am.cur.persons} 人・${am.cur.hours}h\n` +
    `招募管理：收件 ${rm.total} 份・本月錄取 ${rm.periodHires.length} 人・${rm.openUnfilled.length === 0 ? '職缺已補實' : '尚有 ' + rm.openUnfilled.length + ' 職缺招募中'}\n` +
    `員工關懷：高風險 ${cm.highRisk} 人・中風險 ${cm.midRisk} 人・${cm.isCareMonth ? '覆蓋率 ' + cm.coverageRate + '%（' + cm.coveredIds.length + '/' + cm.eligibleEmps.length + '）' : '本月非關懷月'}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.print-btn:last-child');
    const orig = btn.textContent;
    btn.textContent = '✅ 已複製';
    setTimeout(() => btn.textContent = orig, 2000);
  });
}
